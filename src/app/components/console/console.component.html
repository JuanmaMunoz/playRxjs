<div class="console">
  <button
    type="button"
    (click)="clearConsole()"
    class="console__clear"
    [attr.aria-label]="'clearConsole' | translate"
  >
    <i class="bi bi-trash" aria-hidden="true"></i>
  </button>
  <div class="console__output">{{ 'output' | translate }}</div>
  <div [id]="'console-' + id" class="console__container"></div>
</div>
