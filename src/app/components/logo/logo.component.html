@if (showLogo) {
  <div [@show] class="logo">
    <img
      [@spin]="{
        value: state,
        params: params
      }"
      (@spin.done)="next()"
      [src]="image"
      alt="RxJS animated logo"
      width="512"
      height="512"
      [style.width.px]="width"
      [style.height.px]="width"
      [style.borderWidth.px]="borderWidth"
    />
  </div>
}
